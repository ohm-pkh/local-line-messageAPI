<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socket Console</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: #12181f;
    --panel-2: #161d26;
    --line: #232b35;
    --text: #d7dee6;
    --dim: #6b7686;
    --accent: #4fd1a5;
    --accent-dim: #2c5c4a;
    --warn: #e0a75e;
    --err: #e0685e;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px;
    min-height:100vh;
  }
  .wrap{ max-width:1080px; margin:0 auto; padding:28px 20px 60px; }

  header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; border-bottom:1px solid var(--line); padding-bottom:16px; }
  header h1{ font-family:var(--mono); font-size:16px; font-weight:600; letter-spacing:0.5px; margin:0; color:var(--text); }
  header h1 span{ color:var(--accent); }
  .status{ font-family:var(--mono); font-size:12px; display:flex; align-items:center; gap:7px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--err); box-shadow:0 0 0 3px rgba(224,104,94,0.15); transition:.2s; }
  .dot.on{ background:var(--accent); box-shadow:0 0 0 3px rgba(79,209,165,0.15); }
  .dot.connecting{ background:var(--warn); box-shadow:0 0 0 3px rgba(224,167,94,0.15); animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{opacity:0.4;} }

  .grid{ display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; overflow:hidden; }
  .panel-h{ padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .panel-h .t{ font-family:var(--mono); font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--dim); }
  .panel-h button.small{ font-family:var(--mono); font-size:11px; background:none; border:1px solid var(--line); color:var(--dim); padding:4px 9px; border-radius:5px; cursor:pointer; }
  .panel-h button.small:hover{ color:var(--text); border-color:var(--dim); }

  /* messages */
  #messages{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-height:340px; max-height:460px; }
  .msg{ max-width:78%; padding:9px 12px; border-radius:9px; font-size:13.5px; line-height:1.45; position:relative; cursor:default; }
  .msg.out{ align-self:flex-end; background:var(--accent-dim); border:1px solid #3a7360; }
  .msg.in{ align-self:flex-start; background:var(--panel-2); border:1px solid var(--line); }
  .msg .quote{ font-size:11.5px; color:var(--dim); border-left:2px solid var(--dim); padding-left:7px; margin-bottom:5px; font-family:var(--mono); }
  .msg .meta{ font-family:var(--mono); font-size:10px; color:var(--dim); margin-top:5px; display:flex; gap:8px; }
  .msg .reply-btn{ font-family:var(--mono); font-size:10px; color:var(--dim); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; }
  .msg .reply-btn:hover{ color:var(--accent); }
  .empty-hint{ margin:auto; color:var(--dim); font-family:var(--mono); font-size:12px; text-align:center; }

  .quoting-bar{ display:none; padding:8px 16px; background:var(--panel-2); border-top:1px solid var(--line); font-family:var(--mono); font-size:11.5px; color:var(--dim); align-items:center; justify-content:space-between; }
  .quoting-bar.show{ display:flex; }
  .quoting-bar button{ background:none; border:none; color:var(--dim); cursor:pointer; font-size:14px; }

  .composer{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  .composer input[type=text]{ flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:7px; padding:9px 12px; font-family:var(--sans); font-size:13.5px; }
  .composer input[type=text]:focus{ outline:none; border-color:var(--accent-dim); }
  .composer button{ background:var(--accent); color:#08130f; border:none; border-radius:7px; padding:0 16px; font-weight:600; font-size:13px; cursor:pointer; }
  .composer button:disabled{ background:var(--line); color:var(--dim); cursor:not-allowed; }

  .conn-row{ display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .conn-row input{ flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:7px; padding:8px 10px; font-family:var(--mono); font-size:12.5px; }
  .conn-row button{ font-family:var(--mono); font-size:12px; padding:8px 14px; border-radius:7px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer; white-space:nowrap; }
  .conn-row button.primary{ background:var(--accent); color:#08130f; border-color:var(--accent); font-weight:600; }
  .conn-row button:disabled{ opacity:0.5; cursor:not-allowed; }

  /* side column */
  .side{ display:flex; flex-direction:column; gap:16px; }
  .kv{ padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .kv-row{ display:flex; flex-direction:column; gap:4px; }
  .kv-row label{ font-family:var(--mono); font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:0.8px; }
  .kv-val{ font-family:var(--mono); font-size:12.5px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; word-break:break-all; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .kv-val button{ background:none; border:none; color:var(--dim); cursor:pointer; font-size:11px; font-family:var(--mono); flex-shrink:0; }
  .kv-val button:hover{ color:var(--accent); }
  .placeholder{ color:var(--dim); font-style:italic; }

  form.webhook{ padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  form.webhook label{ font-family:var(--mono); font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:0.8px; }
  form.webhook input, form.webhook select{ background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px 10px; font-family:var(--mono); font-size:12.5px; }
  form.webhook input:focus, form.webhook select:focus{ outline:none; border-color:var(--accent-dim); }
  form.webhook button{ margin-top:2px; background:var(--accent); color:#08130f; border:none; border-radius:7px; padding:9px; font-weight:600; font-size:13px; cursor:pointer; }
  form.webhook button:disabled{ background:var(--line); color:var(--dim); cursor:not-allowed; }
  .webhook-result{ font-family:var(--mono); font-size:11.5px; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); white-space:pre-wrap; word-break:break-all; display:none; }
  .webhook-result.show{ display:block; }
  .webhook-result.ok{ border-color:var(--accent-dim); color:var(--accent); }
  .webhook-result.fail{ border-color:#5c2c2c; color:var(--err); }

  .log{ padding:10px 16px; font-family:var(--mono); font-size:11px; color:var(--dim); max-height:120px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; }
  .log .l-err{ color:var(--err); }
  .log .l-ok{ color:var(--accent); }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>socket<span>://</span>console</h1>
    <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">disconnected</span></div>
  </header>

  <div class="grid">
    <!-- LEFT: connection + chat -->
    <div class="panel">
      <div class="conn-row" style="border-bottom:1px dashed var(--line);">
        <input type="text" id="baseUrl" value="" placeholder="Base URL, e.g. https://api.example.com  (leave blank = same host)" spellcheck="false">
        <button id="applyBaseUrl">Apply</button>
      </div>
      <div class="conn-row">
        <input type="text" id="wsUrl" value="/ws/v1/connect" spellcheck="false">
        <button class="primary" id="connectBtn">Connect</button>
      </div>

      <div id="messages"><div class="empty-hint">No messages yet — connect and send one.</div></div>

      <div class="quoting-bar" id="quotingBar">
        <span id="quotingText"></span>
        <button id="cancelQuote" title="Cancel reply">✕</button>
      </div>

      <div class="composer">
        <input type="text" id="msgInput" placeholder="Type a message…" disabled>
        <button id="sendBtn" disabled>Send</button>
      </div>

      <div class="panel-h" style="border-top:1px solid var(--line); border-bottom:none;">
        <span class="t">Event log</span>
        <button class="small" id="clearLog">Clear</button>
      </div>
      <div class="log" id="log"></div>
    </div>

    <!-- RIGHT: secret + webhook -->
    <div class="side">
      <div class="panel">
        <div class="panel-h">
          <span class="t">Channel secret</span>
          <button class="small" id="fetchSecretBtn">Fetch</button>
        </div>
        <div class="kv">
          <div class="kv-row">
            <label>Access token</label>
            <div class="kv-val"><span id="accessTokenVal" class="placeholder">not fetched</span><button data-copy="accessTokenVal">copy</button></div>
          </div>
          <div class="kv-row">
            <label>Channel secret</label>
            <div class="kv-val"><span id="channelSecretVal" class="placeholder">not fetched</span><button data-copy="channelSecretVal">copy</button></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-h"><span class="t">Register webhook</span></div>
        <form class="webhook" id="webhookForm">
          <div>
            <label for="webhookUrl">Webhook URL</label>
            <input type="text" id="webhookUrl" placeholder="https://example.com/hooks/incoming" required>
          </div>
          <button type="submit" id="webhookSubmit">Register webhook</button>
          <div class="webhook-result" id="webhookResult"></div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="/config.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const statusDot = $('statusDot'), statusText = $('statusText');
  const wsUrlInput = $('wsUrl'), connectBtn = $('connectBtn');
  const messagesEl = $('messages'), msgInput = $('msgInput'), sendBtn = $('sendBtn');
  const quotingBar = $('quotingBar'), quotingText = $('quotingText'), cancelQuote = $('cancelQuote');
  const logEl = $('log'), clearLogBtn = $('clearLog');

  let socket = null;
  let quoteTarget = null; // { messageId, text }
  const messageStore = {}; // messageId -> {text, el}
  let baseUrl = (window.APP_CONFIG && window.APP_CONFIG.BASE_URL) || ''; // set via env at container start, or blank to use relative paths (recommended when nginx proxies /api and /ws to the backend)
  $('baseUrl').value = baseUrl;

  function buildHttpUrl(path){
    if(!baseUrl) return path; // relative to current page's host
    return baseUrl.replace(/\/$/, '') + (path.startsWith('/') ? path : '/' + path);
  }

  function buildWsUrl(path){
    if(path.startsWith('ws://') || path.startsWith('wss://')) return path;
    if(baseUrl){
      // strip any http(s) scheme from baseUrl and force ws://
      const hostPart = baseUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
      return 'ws://' + hostPart + (path.startsWith('/') ? path : '/' + path);
    }
    return 'ws://' + location.host + (path.startsWith('/') ? path : '/' + path);
  }

  function log(msg, level){
    const line = document.createElement('div');
    if(level) line.className = 'l-' + level;
    const t = new Date().toLocaleTimeString();
    line.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(state){
    statusDot.className = 'dot' + (state === 'on' ? ' on' : state === 'connecting' ? ' connecting' : '');
    statusText.textContent = state === 'on' ? 'connected' : state === 'connecting' ? 'connecting…' : 'disconnected';
    const connected = state === 'on';
    msgInput.disabled = !connected;
    sendBtn.disabled = !connected;
    connectBtn.textContent = connected ? 'Disconnect' : 'Connect';
    connectBtn.classList.toggle('primary', !connected);
  }

  function genMessageId(){
    return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
  }

  function clearEmptyHint(){
    const hint = messagesEl.querySelector('.empty-hint');
    if(hint) hint.remove();
  }

  function renderMessage({ direction, text, messageId, quoteMessageId, timestamp }){
    clearEmptyHint();
    const el = document.createElement('div');
    el.className = 'msg ' + (direction === 'out' ? 'out' : 'in');
    el.dataset.messageId = messageId;

    if(quoteMessageId){
      const quoted = messageStore[quoteMessageId];
      const q = document.createElement('div');
      q.className = 'quote';
      q.textContent = '↩ ' + (quoted ? quoted.text : '(reply to ' + quoteMessageId + ' — not found in this session)');
      el.appendChild(q);
    }

    const body = document.createElement('div');
    body.textContent = text;
    el.appendChild(body);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const time = document.createElement('span');
    time.textContent = new Date(timestamp).toLocaleTimeString();
    meta.appendChild(time);
    const replyBtn = document.createElement('button');
    replyBtn.className = 'reply-btn';
    replyBtn.textContent = 'reply';
    replyBtn.addEventListener('click', () => setQuote(messageId, text));
    meta.appendChild(replyBtn);
    el.appendChild(meta);

    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    messageStore[messageId] = { text, el };
  }

  function setQuote(messageId, text){
    quoteTarget = { messageId, text };
    quotingText.textContent = 'Replying to: ' + (text.length > 60 ? text.slice(0, 60) + '…' : text);
    quotingBar.classList.add('show');
    msgInput.focus();
  }

  cancelQuote.addEventListener('click', () => {
    quoteTarget = null;
    quotingBar.classList.remove('show');
  });

  function connectSocket(){
    if(socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)){
      socket.close();
      return;
    }
    const url = wsUrlInput.value.trim();
    if(!url){ log('Enter a websocket URL first', 'err'); return; }

    const fullUrl = buildWsUrl(url);

    setStatus('connecting');
    log('Connecting to ' + fullUrl + ' …');

    try{
      socket = new WebSocket(fullUrl);
    }catch(err){
      log('Failed to open socket: ' + err.message, 'err');
      setStatus('off');
      return;
    }

    socket.addEventListener('open', () => {
      setStatus('on');
      log('Connection established', 'ok');
    });

    socket.addEventListener('close', (ev) => {
      setStatus('off');
      log('Connection closed' + (ev.code ? ' (code ' + ev.code + ')' : ''));
    });

    socket.addEventListener('error', () => {
      log('Socket error', 'err');
    });

    socket.addEventListener('message', (ev) => {
      let payload;
      try{
        payload = JSON.parse(ev.data);
      }catch(err){
        log('Received non-JSON payload, ignored', 'err');
        return;
      }
      log('Raw payload: ' + ev.data);
      const data = payload.Data || payload.data || {};
      const quoteMessageId = payload.quotedMessageId || payload.QuotedMessageId || payload.quoted_message_id
        || payload.quoteMessageId || payload.QuoteMessageId || payload.quote_message_id || null;
      renderMessage({
        direction: 'in',
        text: data.Message || data.message || '',
        messageId: data.MessageId || data.messageId || data.message_id || genMessageId(),
        quoteMessageId: quoteMessageId,
        timestamp: payload.timestamp || payload.Timestamp || Date.now()
      });
      log('Message received' + (quoteMessageId ? ' (reply to ' + quoteMessageId + ')' : ''));
    });
  }

  connectBtn.addEventListener('click', connectSocket);

  function sendMessage(){
    const text = msgInput.value.trim();
    if(!text || !socket || socket.readyState !== WebSocket.OPEN) return;

    const messageId = genMessageId();
    const timestamp = Date.now();
    const packet = {
      type: 'text',
      quotedMessageId: quoteTarget ? quoteTarget.messageId : '',
      timestamp: timestamp,
      Data: {
        Message: text,
        MessageId: messageId
      }
    };

    try{
      socket.send(JSON.stringify(packet));
      renderMessage({
        direction: 'out',
        text,
        messageId,
        quoteMessageId: packet.quotedMessageId || null,
        timestamp
      });
      log('Message sent');
    }catch(err){
      log('Send failed: ' + err.message, 'err');
    }

    msgInput.value = '';
    quoteTarget = null;
    quotingBar.classList.remove('show');
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });
  clearLogBtn.addEventListener('click', () => { logEl.innerHTML = ''; });

  // ---- Secret fetch ----
  async function fetchSecret(){
    const btn = $('fetchSecretBtn');
    btn.disabled = true;
    btn.textContent = '…';
    try{
      const res = await fetch(buildHttpUrl('/api/v1/secret/'));
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      $('accessTokenVal').textContent = data.accessToken || '(empty)';
      $('accessTokenVal').classList.remove('placeholder');
      $('channelSecretVal').textContent = data.channelSecret || '(empty)';
      $('channelSecretVal').classList.remove('placeholder');
      log('Secret fetched', 'ok');
    }catch(err){
      log('Failed to fetch secret: ' + err.message, 'err');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Fetch';
    }
  }

  $('fetchSecretBtn').addEventListener('click', fetchSecret);

  document.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = $(btn.dataset.copy).textContent;
      if(!val || val === 'not fetched') return;
      navigator.clipboard.writeText(val).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'copied';
        setTimeout(() => btn.textContent = orig, 1200);
      });
    });
  });

  // ---- Webhook registration ----
  $('webhookForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = $('webhookUrl').value.trim();
    const resultEl = $('webhookResult');
    const submitBtn = $('webhookSubmit');
    if(!url) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Registering…';
    resultEl.classList.remove('show', 'ok', 'fail');

    try{
      const res = await fetch(buildHttpUrl('/api/v1/webhook/register'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const text = await res.text();
      let pretty = text;
      try{ pretty = JSON.stringify(JSON.parse(text), null, 2); }catch(_e){}

      resultEl.textContent = (res.ok ? 'Registered — ' : 'Failed (' + res.status + ') — ') + pretty;
      resultEl.classList.add('show', res.ok ? 'ok' : 'fail');
      log(res.ok ? 'Webhook registered' : 'Webhook registration failed', res.ok ? 'ok' : 'err');
    }catch(err){
      resultEl.textContent = 'Request error: ' + err.message;
      resultEl.classList.add('show', 'fail');
      log('Webhook request error: ' + err.message, 'err');
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = 'Register webhook';
    }
  });

  // ---- Base URL apply ----
  $('applyBaseUrl').addEventListener('click', () => {
    baseUrl = $('baseUrl').value.trim();
    log(baseUrl ? 'Base URL set to ' + baseUrl : 'Base URL cleared (using same host)');
    if(socket && socket.readyState === WebSocket.OPEN) socket.close();
    connectSocket();
    fetchSecret();
  });

  // ---- Auto-run on page load ----
  connectSocket();
  fetchSecret();
})();
</script>
</body>
</html>
